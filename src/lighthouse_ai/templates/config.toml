# Lighthouse user config — see design §30.
[lighthouse]
version = "0.1.0"
data_dir = "{data_dir}"
log_level = "info"

[hardware]
detected_tier = "{detected_tier}"
backend_preference = ["mlx", "ollama"]
total_ram_gb = {total_ram_gb}

[runtime]
max_concurrent_jobs = 3
checkpoint_every_node = true

# Host-courtesy throttle for background LLM work (OpenHuman §1). The Governor
# meters budget + RAM; this adds host pressure — is now a polite time to run?
[governor.scheduler_gate]
mode = "auto"                 # auto | aggressive | off
battery_floor_pct = 80        # below this on battery → Throttled
cpu_idle_ceiling_pct = 70     # above this → Throttled
sample_interval_s = 30
throttled_backoff_ms = 2000   # sleep before each permit when throttled
paused_poll_ms = 5000         # re-poll cadence when paused
max_concurrent_llm = 1        # global slot count (raise on T3+)

[depth]
default_preset = "standard"

[litestream]
config_path = "{litestream_config}"

[reproducibility]
require_digest_match = true
allow_drift_with_flag = true

[notifications]
desktop_enabled = true
email_enabled = false
events = ["draft_ready", "monitor_alert_high", "budget_warn", "budget_trip"]

# Telegram Bot notifications (optional)
# telegram_bot_token = ""   # your bot token from @BotFather
# telegram_chat_id = ""     # your chat/group id

[logseq]
# Set to your Logseq graph's pages directory to enable automatic page export
# when drafts are approved.
# graph_dir = "~/Documents/logseq/pages"
enabled = false
