# Lighthouse user config — see design §30.
[lighthouse]
version = "0.1.0"
data_dir = "{data_dir}"
log_level = "info"

[hardware]
detected_tier = "{detected_tier}"
backend_preference = ["mlx", "ollama"]
total_ram_gb = {total_ram_gb}

[runtime]
max_concurrent_jobs = 3
checkpoint_every_node = true

# Host-courtesy throttle for background LLM work (OpenHuman §1). The Governor
# meters budget + RAM; this adds host pressure — is now a polite time to run?
[governor.scheduler_gate]
mode = "auto"                 # auto | aggressive | off
battery_floor_pct = 80        # below this on battery → Throttled
cpu_idle_ceiling_pct = 70     # above this → Throttled
sample_interval_s = 30
throttled_backoff_ms = 2000   # sleep before each permit when throttled
paused_poll_ms = 5000         # re-poll cadence when paused
max_concurrent_llm = 1        # global slot count (raise on T3+)

[modes]
# Reversible feature flag (the "wedge"): which research modes the default UI
# OFFERS. Every mode stays in the code and remains runnable if requested by its
# explicit key — this only gates what the picker surfaces. Widen this list to
# re-expose the full mode set.
enabled = ["investigate"]

[depth]
default_preset = "standard"
# Reversible feature flag (the "wedge"): which depth tiers the default UI OFFERS.
# "deep" (the recursive exhaustive tier) stays in the code but is hidden by
# default. Add "deep" here to re-expose it.
enabled_tiers = ["quick", "standard", "thorough"]

[rag]
# Vector store backend. Default "memory" needs NO Docker and NO Qdrant — it
# uses the in-process store backed by the local SQLite spine, so `lighthouse`
# runs out of the box. Switch to "qdrant" only if you want the production HNSW
# index; that one requires booting the optional Docker stack
# (scripts/lh-stack.docker-compose.yml). Qdrant is OPTIONAL, not required to start.
vector_store = "memory"
qdrant_url = "http://127.0.0.1:6333"   # only used when vector_store = "qdrant"

[litestream]
config_path = "{litestream_config}"

[reproducibility]
require_digest_match = true
allow_drift_with_flag = true

[notifications]
desktop_enabled = true
email_enabled = false
events = ["draft_ready", "monitor_alert_high"]

[ui]
# When true, a staged artifact (a finished job awaiting review) sends a concise
# summary to the configured Telegram chat. Off by default — and a no-op anyway
# until a Telegram bot token + chat id are configured. The §24.10 destructive-
# action airlock is unaffected by this flag.
notify_enabled = false
telegram_bot_token = ""
telegram_chat_id = ""
