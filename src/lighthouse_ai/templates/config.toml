# Lighthouse user config — see design §30.
[lighthouse]
version = "0.1.0"
data_dir = "{data_dir}"
log_level = "info"

[hardware]
detected_tier = "{detected_tier}"
backend_preference = ["mlx", "ollama"]
total_ram_gb = {total_ram_gb}

[runtime]
max_concurrent_jobs = 3
checkpoint_every_node = true

# Host-courtesy throttle for background LLM work (OpenHuman §1). The Governor
# meters budget + RAM; this adds host pressure — is now a polite time to run?
[governor.scheduler_gate]
mode = "auto"                 # auto | aggressive | off
battery_floor_pct = 80        # below this on battery → Throttled
cpu_idle_ceiling_pct = 70     # above this → Throttled
sample_interval_s = 30
throttled_backoff_ms = 2000   # sleep before each permit when throttled
paused_poll_ms = 5000         # re-poll cadence when paused
max_concurrent_llm = 1        # global slot count (raise on T3+)

[depth]
default_preset = "standard"

[litestream]
config_path = "{litestream_config}"

[reproducibility]
require_digest_match = true
allow_drift_with_flag = true

[notifications]
desktop_enabled = true
email_enabled = false

# Events routed to ALL configured channels (desktop, discord, telegram).
# Available events: draft_ready, draft_approved, job_started, job_completed,
#   job_failed, monitor_alert_high, monitor_alert_medium, budget_warn, budget_trip,
#   logseq_synced, escalation_raised, position_resolved
events = ["draft_ready", "draft_approved", "monitor_alert_high", "budget_warn", "budget_trip"]

# Telegram Bot notifications (optional — set bot_token + chat_id to enable).
# Get a token from @BotFather; get your chat_id by messaging @userinfobot.
# telegram_bot_token = ""   # e.g. "123456:ABC-DEF..."
# telegram_chat_id = ""     # e.g. "123456789"

# Override which events reach Telegram (defaults to [notifications] events above).
# Useful to keep Telegram quiet for low-priority events.
# telegram_events = ["draft_approved", "monitor_alert_high", "budget_trip", "escalation_raised"]

[telegram_bot]
# Set commands_enabled = true to let the Telegram bot accept CLI commands.
# Requires telegram_bot_token + telegram_chat_id in [notifications] above.
# Only the configured chat_id can issue commands — all other origins are ignored.
commands_enabled = false

[logseq]
# Set graph_dir to your Logseq graph's root directory (not the pages/ subdirectory).
# Lighthouse writes to <graph_dir>/pages/ automatically.
# graph_dir = "~/Documents/logseq"
enabled = false
sync_interval_hours = 24   # hours between automatic syncs; 0 = sync once on startup only

[sources]
# SearXNG self-hosted meta-search engine (used for CRAG mid-loop web fetch)
# Run via: make stack-up  (see docker-compose in scripts/)
# searxng_url = "http://localhost:8888"
crag_enabled = true    # set false to disable mid-loop web fetch
