id          = "associated_press"
name        = "Associated Press"
description = """\
AP wire service — U.S.-centric breaking news, politics, sports, and \
international coverage. Fetches AP RSS feeds and searches ap.org for \
topic-specific articles. Returns recent articles as Documents.\
"""
category    = "news"
version     = "0.1.0"

# --- fetch policy ---
tier        = "A"
base_url    = "https://apnews.com"
allowed_domains = [
    "apnews.com",
    "www.apnews.com",
    "storage.googleapis.com",
    "feeds.apnews.com",
]
rate_limit_per_sec = 1.0
robots_policy      = "obey"

# --- provenance ---
default_grade      = "A"
license            = "ap-terms"
signed             = true
enabled_by_default = true

# --- recommender scoring surface ---
supported_question_types = [
    "current_events",
    "trend_analysis",
    "exploratory",
    "list_enumeration",
    "fact_lookup",
]
topics = [
    "news", "journalism", "current_events", "us_news",
    "politics", "sports", "world_news", "business",
]
modes_natural_fit = ["watch", "investigate", "survey"]
modes_weak_fit    = ["adjudicate"]
output_shape      = "enumerable"
temporal_tools    = true
perspective_lens  = "popular"
authority         = "wire_service"

# Adjudicate diversity — AllSides media bias rating
audit_tags = ["allsides:center", "news:wire"]

domains = ["journalism", "politics", "us_news", "world_affairs", "sports"]

# --- Watch (Pattern-2) ---
watchable       = true
watchable_tools = ["list_recent_in_topic"]
