id          = "oecd"
name        = "OECD Data"
description = "OECD SDMX API: comparative cross-country economic and social indicators for OECD member countries and key partners. GDP, labor, prices, education, health, environment, taxation, and well-being."
category    = "economics"
version     = "0.1.0"
hidden      = true   # outside current wedge (legal/practice-support); loadable if explicitly named, not offered by default

# --- fetch policy ---
tier        = "A"
base_url    = "https://sdmx.oecd.org"
allowed_domains = ["sdmx.oecd.org", "data.oecd.org", "stats.oecd.org"]
rate_limit_per_sec = 1.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # OECD compiles harmonized statistics from member national statistical agencies
license       = "CC-BY-4.0"
signed        = true
enabled_by_default = false   # requires trust add

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
    "time_series",
]
topics = ["economics", "policy", "comparative_research", "labor", "education",
          "health", "taxation", "environment", "productivity", "well_being"]
domains = ["economics", "policy", "comparative_research"]
primary_for = ["comparative_research"]
secondary_for = ["economics", "policy"]
modes_natural_fit  = ["investigate", "survey", "adjudicate"]
modes_weak_fit     = ["ask", "decide"]
output_shape       = "enumerable"
temporal_tools     = true
perspective_lens   = "empirical"
authority          = "primary_statistical"

# --- Watch (Pattern-2) ---
watchable       = false
