id          = "census"
name        = "U.S. Census Bureau"
description = "Census Data API: American Community Survey (ACS), decennial census, and population estimates. Demographics, income, housing, education, and geographic data down to tract/block group level."
category    = "demographics"
version     = "0.1.0"

# --- fetch policy ---
tier        = "A"
base_url    = "https://api.census.gov"
allowed_domains = ["api.census.gov", "data.census.gov"]
rate_limit_per_sec = 2.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # Census is the primary source for U.S. demographic data
license       = "public-domain"
signed        = true
enabled_by_default = false   # requires trust add; api_key recommended

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
]
topics = ["policy", "demographics", "sociology", "journalism", "economics",
          "housing", "education", "income", "poverty", "geography"]
domains = ["policy", "demographics", "sociology", "journalism", "economics"]
primary_for = ["demographics"]
secondary_for = ["policy", "sociology", "journalism", "economics"]
modes_natural_fit  = ["investigate", "survey"]
modes_weak_fit     = ["ask", "decide", "reconstruct"]
output_shape       = "enumerable"
temporal_tools     = false
perspective_lens   = "empirical"
authority          = "primary_statistical"

# --- Watch (Pattern-2) ---
watchable       = false
