id          = "congress"
name        = "Congress.gov"
description = "Congress.gov API v3: search bills, fetch individual bill details, retrieve vote and action records, track committee referrals (watchable), and monitor current legislative activity."
category    = "legislative"
version     = "0.1.0"

# --- fetch policy ---
# NOTE: api.congress.gov is NOT on the default platform allowlist.
# The skill degrades gracefully (returns [] + logged note) until the user runs:
#   lighthouse trust add api.congress.gov
tier        = "A"
base_url    = "https://api.congress.gov"
allowed_domains = ["api.congress.gov", "www.congress.gov", "congress.gov"]
rate_limit_per_sec = 1.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # authoritative primary legislative documents
license       = "public-domain"
signed        = true
enabled_by_default = false   # requires trust add + API key to unlock

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
    "procedural",
    "legislative_tracking",
]
topics = ["policy", "politics", "legal", "government", "legislative",
          "congress", "bills", "voting_records", "committees", "journalism",
          "lobbying"]
modes_natural_fit  = ["investigate", "survey", "watch", "reconstruct"]
modes_weak_fit     = ["ask", "decide"]
output_shape       = "enumerable"
temporal_tools     = true
perspective_lens   = "regulatory"
authority          = "regulatory_primary"

# --- Watch (Pattern-2) ---
watchable       = true
watchable_tools = ["track_committee"]
