id          = "bea"
name        = "BEA (Bureau of Economic Analysis)"
description = "BEA API: GDP, personal income, national accounts (NIPA tables), international trade, and regional/industry accounts. Authoritative source for U.S. national income and product accounts."
category    = "economics"
version     = "0.1.0"
hidden      = true   # outside current wedge (legal/practice-support); loadable if explicitly named, not offered by default

# --- fetch policy ---
tier        = "A"
base_url    = "https://apps.bea.gov"
allowed_domains = ["apps.bea.gov"]
rate_limit_per_sec = 1.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # BEA is the primary source for U.S. national accounts
license       = "public-domain"
signed        = true
enabled_by_default = false   # requires api_key + trust add
requires_key_env = ["BEA_API_KEY"]   # BEA 403s without a UserID key — pre-flight short-circuit

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
    "time_series",
]
topics = ["economics", "policy", "gdp", "national_accounts", "income",
          "regional_economics", "industry_economics", "trade"]
domains = ["economics", "policy", "regional_economics"]
primary_for = ["economics"]
secondary_for = ["policy"]
modes_natural_fit  = ["investigate", "survey", "reconstruct"]
modes_weak_fit     = ["ask", "decide"]
output_shape       = "enumerable"
temporal_tools     = true
perspective_lens   = "empirical"
authority          = "primary_statistical"

# --- Watch (Pattern-2) ---
watchable       = false
