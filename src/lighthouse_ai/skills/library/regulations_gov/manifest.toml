id          = "regulations_gov"
name        = "regulations.gov"
description = "Regulations.gov API v4: search public comment dockets, fetch individual dockets, list public comments (watchable), and track docket activity for active rulemakings."
category    = "regulatory"
version     = "0.1.0"

# --- fetch policy ---
# NOTE: api.regulations.gov is NOT on the default platform allowlist.
# The skill degrades gracefully (returns [] + logged note) until the user runs:
#   lighthouse trust add api.regulations.gov
tier        = "A"
base_url    = "https://api.regulations.gov"
allowed_domains = ["api.regulations.gov", "www.regulations.gov", "regulations.gov"]
rate_limit_per_sec = 1.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # official government dockets are grade A; comments are B (set per-doc)
license       = "public-domain"
signed        = true
enabled_by_default = false   # requires trust add + API key to unlock

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
    "procedural",
    "public_participation",
]
topics = ["policy", "legal", "regulatory", "government", "administrative_law",
          "rulemaking", "public_comments", "lobbying", "journalism"]
modes_natural_fit  = ["investigate", "survey", "watch", "adjudicate"]
modes_weak_fit     = ["ask", "decide"]
output_shape       = "enumerable"
temporal_tools     = true
perspective_lens   = "regulatory"
authority          = "regulatory_primary"

# --- Watch (Pattern-2) ---
watchable       = true
watchable_tools = ["track_docket_activity"]
