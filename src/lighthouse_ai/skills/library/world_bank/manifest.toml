id          = "world_bank"
name        = "World Bank Open Data"
description = "World Bank API: international development indicators for 200+ economies. GDP, poverty, health, education, infrastructure, environment. No authentication required."
category    = "economics"
version     = "0.1.0"
hidden      = true   # outside current wedge (legal/practice-support); loadable if explicitly named, not offered by default

# --- fetch policy ---
tier        = "A"
base_url    = "https://api.worldbank.org"
allowed_domains = ["api.worldbank.org", "data.worldbank.org"]
rate_limit_per_sec = 2.0
robots_policy = "obey"

# --- provenance ---
default_grade = "A"   # World Bank compiles from national statistical agencies; grade A for aggregated development data
license       = "CC-BY-4.0"
signed        = true
enabled_by_default = false   # requires trust add

# --- recommender scoring surface ---
supported_question_types = [
    "factual_lookup",
    "causal_explanation",
    "exploratory_survey",
    "comparative",
    "time_series",
]
topics = ["economics", "international_development", "policy", "global_health",
          "poverty", "education", "infrastructure", "environment", "trade"]
domains = ["economics", "international_development", "policy", "global_health"]
primary_for = ["international_development"]
secondary_for = ["economics", "policy", "global_health"]
modes_natural_fit  = ["investigate", "survey", "reconstruct", "adjudicate"]
modes_weak_fit     = ["ask", "decide"]
output_shape       = "enumerable"
temporal_tools     = true
perspective_lens   = "empirical"
authority          = "primary_statistical"

# --- Watch (Pattern-2) ---
watchable       = false
