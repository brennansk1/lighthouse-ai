[project]
name = "lighthouse-ai"
version = "0.1.0"
description = "Lighthouse — local-first, hardware-adaptive 24/7 multi-agent research system."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Lighthouse Contributors" }]
keywords = ["research", "rag", "agents", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psutil>=5.9",
    "structlog>=24.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "jinja2>=3.1.6",
    "qdrant-client>=1.18.0",
    "keyring>=25.7.0",
    "textual>=8.2.7",
]

[project.optional-dependencies]
gpu-nvidia = ["pynvml>=11.5"]

[project.scripts]
lighthouse = "lighthouse_ai.cli:app"
lighthouse-supervisor = "lighthouse_ai.supervisor:main"
lighthouse-tui = "lighthouse_ai.tui.app:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv_build.module]
include = ["src/lighthouse_ai/web/static/**"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "anyio>=4.4",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.23.1",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external binaries or longer-running setup",
    "litestream: requires litestream binary on PATH",
]

[tool.coverage.run]
branch = true
source = ["lighthouse_ai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
