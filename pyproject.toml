[project]
name = "lighthouse-ai"
version = "0.1.0"
description = "Lighthouse — local-first, hardware-adaptive 24/7 multi-agent research system."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Lighthouse Contributors" }]
keywords = ["research", "rag", "agents", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psutil>=5.9",
    "structlog>=24.1",
    "tenacity>=8.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "jinja2>=3.1.6",
    "qdrant-client>=1.18.0",
    "keyring>=25.7.0",
    "textual>=8.2.7",
]

[project.optional-dependencies]
gpu-nvidia = ["pynvml>=11.5"]
# Heavy cross-encoder reranker (pulls torch). Lazy-imported; absent → graceful
# fallback to the score-passthrough reranker. Install to activate real reranking.
reranker = ["FlagEmbedding>=1.3"]
# Entailment-based faithfulness gate (Sprint 30). Lazy-imported; absent →
# discipline gate falls back to regex-only citation coverage check.
# MiniCheck (lytang/MiniCheck-Flan-T5-Large) must be installed separately
# from source if not yet on PyPI: pip install git+https://github.com/Liyan06/MiniCheck
faithfulness = ["sentence-transformers>=2.0"]
# --- Acquisition stack (audit Part B). All lazy-imported; absent → graceful
# fallback to the stdlib paths. Install the extras a deployment actually needs. ---
# Article/PDF/office extraction. trafilatura is the primary HTML extractor;
# pdfplumber/docling improve PDF + structured-doc fidelity over the pypdf
# fallback. NB: PyMuPDF is AGPL-3.0 and lives in the separate `pdf-fast` extra
# below — never a default for an MIT project.
extraction = ["trafilatura>=1.8", "pdfplumber>=0.11", "docling>=2.0"]
# AGPL-3.0, opt-in only: faster/Markdown PDF extraction. Distribution hazard.
pdf-fast = ["pymupdf>=1.24"]
# Politeness layer for net.py: robots.txt (protego), URL canonicalization +
# crawl-delay (courlan), per-domain token-bucket budgets (pyrate-limiter).
politeness = ["protego>=0.3", "courlan>=1.3", "pyrate-limiter>=3.6"]
# Learned prompt-injection classifier (ProtectAI deberta-v3) behind the regex
# gate. ONNX-runnable via Optimum; absent → regex-only gate.
injection-ml = ["transformers>=4.40", "optimum[onnxruntime]>=1.20"]
# Sandbox hardening: YARA signatures + deeper PDF inspection (pikepdf, MPL-2.0).
sandbox-hardening = ["yara-python>=4.4", "pikepdf>=9.0"]
# YouTube captions path (official API + public-caption endpoints only, no
# evasion). yt-dlp is Unlicense; youtube-transcript-api is MIT.
youtube = ["yt-dlp>=2024.0", "youtube-transcript-api>=1.0"]
# Tier-B in-process JS rendering (declared; not built in this pass). No evasion.
js-render = ["playwright>=1.44"]

[project.scripts]
lighthouse = "lighthouse_ai.cli:app"
lighthouse-supervisor = "lighthouse_ai.supervisor:main"
lighthouse-tui = "lighthouse_ai.tui.app:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv_build.module]
include = ["src/lighthouse_ai/web/static/**"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "anyio>=4.4",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.23.1",
    "pytest-textual-snapshot>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external binaries or longer-running setup",
    "litestream: requires litestream binary on PATH",
]

[tool.coverage.run]
branch = true
source = ["lighthouse_ai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# No strict mode yet — the codebase isn't fully typed. mypy is non-blocking in CI.
exclude = ["tests/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",      # line length — handled by formatter, not worth churn
    "RUF001",    # ambiguous unicode in strings — we use en-dash/middot typography intentionally
    "RUF002",    # ditto, in docstrings
    "RUF012",    # mutable class attr needs ClassVar — pedantic for our dataclass configs
    "RUF059",    # unused unpacked variable — fine for readability (e.g. `a, _b = ...`)
    "B008",      # function call in default — this IS the Typer pattern (typer.Option(...))
    "B905",      # zip() without strict= — equal-length is obvious at every call site
    "SIM105",    # contextlib.suppress vs try/except/pass — try/except is clearer here
    "SIM108",    # ternary vs if/else — readability is a judgment call
    "SIM102",    # nested if — sometimes clearer than a combined condition
    "SIM103",    # return-condition-directly — opinionated
    "SIM110",    # any()/all() loop rewrite — opinionated
    "SIM117",    # combine with-statements — opinionated
    "SIM118",    # key in dict.keys() — harmless
    "UP042",     # StrEnum migration — we target 3.11 but keep str, Enum for clarity
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use patterns ruff flags: late imports to test optional-dep
# paths, blind-except assertions, and bare expressions as importorskip markers.
"tests/*" = ["E402", "B017", "B018"]
