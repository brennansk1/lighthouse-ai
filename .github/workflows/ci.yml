name: CI

on:
  push:
    # Working branches run the gates too — drift on a feature branch (e.g. a
    # mypy regression) must surface before it reaches a PR, not after.
    branches: [main, "claude/**", "feature/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests

      # mypy is a blocking gate: src/lighthouse_ai is clean (0 errors, 259 files).
      - name: Type check (mypy)
        run: uv run mypy src/lighthouse_ai

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Build package
        run: uv build

  release:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release-desktop:
    name: Build macOS Desktop App
    needs: [test]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync

      - name: Build macOS App
        run: |
          uv run pyinstaller --noconfirm --windowed --name "Lighthouse" \
            --add-data "src/lighthouse_ai/web/static:lighthouse_ai/web/static" \
            scripts/desktop.py
          tar -czf Lighthouse-macOS-arm64.tar.gz -C dist Lighthouse.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Lighthouse-macOS-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
